<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image uploadig in Django</title>
</head>
<body>
    <fieldset>
        <legend>Image Uploading</legend>
        <form action="" method="post" enctype="multipart/form-data">
            <center>
                <h1>Image Uploading in Django</h1>
                {% csrf_token %}
                {{form.as_p}}
                <button type="submit">Upload</button>

            </center>
            
        </form>
    </fieldset>
</body>
</html>
